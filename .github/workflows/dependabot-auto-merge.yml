name: Dependabot auto-merge

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 49699333 is the dependabot[bot] user id.
    if: >-
      github.repository == 'langfuse/langfuse-js' &&
      github.event.pull_request.user.id == 49699333
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Uses a PAT because main restricts pushes, so GITHUB_TOKEN cannot enable
      # auto-merge; the PAT-authored merge also triggers push workflows on main.
      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GH_TOKEN_DEPENDABOT_JS_PY }}
